<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Encryption Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: monospace;
            background: #1e1e1e;
            color: #00ff00;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #2d2d2d;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 20px;
        }
        h1 { color: #00ff00; margin-bottom: 20px; }
        .test-result {
            margin-bottom: 15px;
            padding: 10px;
            border-left: 3px solid #666;
            background: #333;
        }
        .test-result.pass {
            border-left-color: #00ff00;
            background: #1a331a;
        }
        .test-result.fail {
            border-left-color: #ff3333;
            background: #331a1a;
        }
        .status { font-weight: bold; }
        .pass { color: #00ff00; }
        .fail { color: #ff3333; }
        button {
            background: #0066cc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
            font-family: monospace;
        }
        button:hover { background: #0052a3; }
        .output {
            background: #1a1a1a;
            border: 1px solid #444;
            padding: 10px;
            margin-top: 10px;
            border-radius: 4px;
            max-height: 200px;
            overflow-y: auto;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 CMS Encryption Test</h1>
        <div id="tests"></div>
        <button onclick="runEncryptionTest()">Test Encryption</button>
        <div id="testOutput" class="output" style="display: none;"></div>
    </div>

    <!-- No external libraries needed - uses Web Crypto API (built into browsers) -->
    <script src="../assets/js/encryption.js"></script>

    <script>
        const testsContainer = document.getElementById('tests');
        const testOutput = document.getElementById('testOutput');

        function addTest(name, passed, details = '') {
            const div = document.createElement('div');
            div.className = `test-result ${passed ? 'pass' : 'fail'}`;
            const status = passed ? '✓ PASS' : '✗ FAIL';
            div.innerHTML = `
                <span class="status">${status}</span>: ${name}
                ${details ? `<div style="margin-top: 5px; opacity: 0.7; font-size: 12px;">${details}</div>` : ''}
            `;
            testsContainer.appendChild(div);
        }

        // Test 1: Web Crypto API available
        const webCryptoAvailable = typeof window !== 'undefined' && 
                                   window.crypto && 
                                   window.crypto.subtle;
        
        if (webCryptoAvailable) {
            addTest('Web Crypto API available', true, 'Using AES-GCM (built-in, no libraries)');
        } else {
            addTest('Web Crypto API available', false, 'window.crypto.subtle not found');
        }

        // Test 2: Encryption module loaded
        if (typeof Encryption !== 'undefined') {
            addTest('Encryption module loaded', true);
        } else {
            addTest('Encryption module loaded', false, 'Encryption object is undefined');
        }

        // Test 3: Encryption has required methods
        if (typeof Encryption !== 'undefined' && 
            typeof Encryption.encrypt === 'function' && 
            typeof Encryption.decrypt === 'function') {
            addTest('Encryption methods available', true);
        } else {
            addTest('Encryption methods available', false, 'encrypt/decrypt methods missing');
        }

        // Run encryption test
        async function runEncryptionTest() {
            try {
                testOutput.style.display = 'block';
                testOutput.textContent = 'Running encryption test...\n\n';

                const testData = { test: 'Hello World', timestamp: new Date().toISOString() };
                const password = 'TestPassword123!';

                testOutput.textContent += '1. Test Data: ' + JSON.stringify(testData) + '\n\n';

                // Encrypt
                const encrypted = await Encryption.encrypt(testData, password);
                testOutput.textContent += '2. Encrypted (first 100 chars): ' + encrypted.substring(0, 100) + '...\n\n';

                // Decrypt
                const decrypted = await Encryption.decrypt(encrypted, password);
                testOutput.textContent += '3. Decrypted: ' + JSON.stringify(decrypted) + '\n\n';

                // Verify
                const matches = JSON.stringify(testData) === JSON.stringify(decrypted);
                testOutput.textContent += `4. Verification: ${matches ? '✓ PASSED - Data matches!' : '✗ FAILED - Data mismatch!'}\n`;
            } catch (error) {
                testOutput.style.display = 'block';
                testOutput.textContent = '❌ ERROR:\n' + error.message + '\n\nStack:\n' + error.stack;
            }
        }
    </script>
</body>
</html>
