<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon — Launch Countdown</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #0b0f19;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #stars-container {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .demo-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 680px;
            padding: 1.5rem;
        }

        .demo-glass-panel {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px) saturate(200%);
            -webkit-backdrop-filter: blur(24px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-xl);
            padding: 3.5rem 2.5rem;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .demo-icon-pod {
            width: 80px;
            height: 80px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(129, 140, 248, 0.2));
            border: 1px solid rgba(56, 189, 248, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.25rem;
            color: #38bdf8;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
        }

        .demo-title {
            font-size: clamp(2.25rem, 5vw, 3.25rem);
            font-weight: 800;
            background: var(--gradient-brand);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }

        .demo-sub {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.6;
            margin: 0;
        }

        #countdown {
            display: flex;
            gap: 1rem;
            align-items: center;
            justify-content: center;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        #countdown .time-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 1.25rem 1.5rem;
            border-radius: var(--radius-lg);
            min-width: 95px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            transition: all var(--transition-normal);
        }

        #countdown .time-box:hover {
            border-color: rgba(56, 189, 248, 0.4);
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.08);
        }

        #countdown .time-box span {
            display: block;
            font-size: 2.25rem;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1;
        }

        #countdown .time-box small {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-top: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <!-- Ambient Background Blobs -->
    <div class="ambient-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    
    <div id="stars-container"></div>

    <div class="demo-wrapper">
        <div class="demo-glass-panel">
            <div class="demo-icon-pod">
                <i class="fas fa-rocket"></i>
            </div>
            <h1 class="demo-title" data-en="Next-Gen Launch" data-bm="Pelancaran Generasi Baru">Next-Gen Launch</h1>
            <p class="demo-sub" data-en="We are preparing an upgraded digital platform. Stay tuned — exciting technological breakthroughs are coming." data-bm="Kami sedang menyediakan platform digital yang dipertingkatkan. Nantikan — penemuan teknologi menarik bakal tiba.">
                We are preparing an upgraded digital platform. Stay tuned — exciting technological breakthroughs are coming.
            </p>
            
            <div id="countdown" aria-live="polite">
                <div class="time-box"><span id="days">0</span><small data-en="Days" data-bm="Hari">Days</small></div>
                <div class="time-box"><span id="hours">00</span><small data-en="Hours" data-bm="Jam">Hours</small></div>
                <div class="time-box"><span id="minutes">00</span><small data-en="Minutes" data-bm="Minit">Minutes</small></div>
                <div class="time-box"><span id="seconds">00</span><small data-en="Seconds" data-bm="Saat">Seconds</small></div>
            </div>

            <a href="index.html" class="btn btn-secondary" style="margin-top: 1rem;">
                <i class="fas fa-arrow-left"></i>
                <span data-en="Return to Main Site" data-bm="Kembali ke Laman Utama">Return to Main Site</span>
            </a>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        const starsContainer = document.getElementById('stars-container');
        const starCount = 120;
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 2.5 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.setProperty('--duration', `${2 + Math.random() * 4}s`);
            star.style.animationDelay = `${Math.random() * 4}s`;
            starsContainer.appendChild(star);
        }

        // Countdown Timer
        (function(){
            const target = new Date(2026, 5, 1, 0, 0, 0); // June 1, 2026
            const daysEl = document.getElementById('days');
            const hoursEl = document.getElementById('hours');
            const minsEl = document.getElementById('minutes');
            const secsEl = document.getElementById('seconds');

            function updateCountdown(){
                const now = new Date();
                let diff = target - now;
                if (diff <= 0) {
                    daysEl.textContent = '0';
                    hoursEl.textContent = '00';
                    minsEl.textContent = '00';
                    secsEl.textContent = '00';
                    clearInterval(intervalId);
                    const heading = document.querySelector('.demo-title');
                    if (heading) heading.textContent = "We're Live!";
                    return;
                }

                const totalSec = Math.floor(diff / 1000);
                const days = Math.floor(totalSec / 86400);
                const hours = Math.floor((totalSec % 86400) / 3600);
                const minutes = Math.floor((totalSec % 3600) / 60);
                const seconds = totalSec % 60;

                daysEl.textContent = days;
                hoursEl.textContent = String(hours).padStart(2, '0');
                minsEl.textContent = String(minutes).padStart(2, '0');
                secsEl.textContent = String(seconds).padStart(2, '0');
            }

            updateCountdown();
            const intervalId = setInterval(updateCountdown, 1000);
        })();
    </script>
</body>
</html>
